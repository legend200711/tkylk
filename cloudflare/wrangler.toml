# ============================================================
# Cloudflare Wrangler Configuration — Shadow Reaper
# Used for Cloudflare Pages deployment.
#
# DO NOT add secrets here. Use:
#   wrangler secret put SECRET_NAME
# or the Cloudflare dashboard → Pages → Settings → Environment Variables
# ============================================================

name = "shadow-reaper"
compatibility_date = "2024-09-02"

# Pages project build settings
[site]
bucket = "./"          # Deploy project root as static site

# ── R2 Bucket binding (for model asset delivery via Worker) ──
# Uncomment if you deploy a Worker proxy for R2 model access.
# [[r2_buckets]]
# binding = "SHADOW_REAPER_MODELS"
# bucket_name = "shadow-reaper-models"
# preview_bucket_name = "shadow-reaper-models-preview"

# ── Environment Variables (PUBLIC only — no secrets) ──────────
[vars]
ENVIRONMENT = "production"
APP_NAME    = "Shadow Reaper"

# Public R2 URL — update with your account subdomain after
# creating the R2 bucket.
# R2_BASE_URL = "https://shadow-reaper-models.YOUR-ACCOUNT-ID.r2.dev"

# ── Secrets — DO NOT put values here ──────────────────────────
# Use:  wrangler secret put FIREBASE_PROJECT_ID
# These secrets are only needed if you add a server-side Worker.
# The browser-only deployment does NOT need server-side secrets.
